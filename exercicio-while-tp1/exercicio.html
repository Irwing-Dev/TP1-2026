<script>
    alert("Vamos calcular a área do quadrado, mas não avacalha!")
    let lado = prompt("Digite o valor do lado: ")
    while (lado <= 0) {
        lado = prompt("Opa, não existe lado negativo ou igual a zero, digite um valor positivo ae!")
    }
    alert("Agora sim, o valor do lado é: " + lado**2)
    
</script>
